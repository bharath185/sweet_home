[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
autorestart=true
priority=100

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
autorestart=true
priority=200

[program:x11vnc]
command=x11vnc -display :1 -nopw -forever -shared -rfbport 5900
autorestart=true
priority=300

[program:novnc]
command=websockify --web /usr/share/novnc 5800 localhost:5900
autorestart=true
priority=400

[program:sweethome3d]
command=sweethome3d
environment=DISPLAY=":1"
autorestart=true
priority=500
