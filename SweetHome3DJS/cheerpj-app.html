<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Home 3D - Complete Web App (CheerpJ WebAssembly)</title>
  <!-- CheerpJ WebAssembly Java Runtime -->
  <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #18181b;
      overflow: hidden;
      font-family: sans-serif;
    }
    #cheerpj-display {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="cheerpj-display"></div>
  <script>
    async function startApp() {
      await cheerpjInit({
        enablePreciseAppletSizing: true
      });
      cheerpjCreateDisplay(-1, -1, document.getElementById("cheerpj-display"));
      await cheerpjRunMain("com.eteks.sweethome3d.SweetHome3D", "/app/SweetHome3D.jar");
    }
    window.addEventListener("DOMContentLoaded", startApp);
  </script>
</body>
</html>
